

# Pipeline 1: Build Custom AMI + Sign Artifact with GPG

# ---- CI Trigger: Run when code is pushed to master ----
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - packer/*
      - ansible/*
    exclude:
      - README.md
      - docs/*

# ---- PR Trigger: Validate on pull requests ----
pr:
  branches:
    include:
      - master
  paths:
    include:
      - packer/*
      - ansible/*

# ---- Variable Group (AWS credentials) ----
variables:
  - group: aws-devops-secrets
  - name: amiName
    value: 'devops-custom-ami'

# ---- Self-hosted agent pool ----
pool:
  name: 'aws-ec2-pool'

stages:
  
  # Stage 1: Validate (runs on BOTH CI push and PR)
  - stage: Validate
    displayName: 'Stage 1 - Validate Packer & Ansible'
    jobs:
      - job: ValidateConfig
        displayName: 'Validate Packer + Ansible Syntax'
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          - script: |
              echo "=== Packer Version ==="
              packer --version

              echo "=== Packer Init ==="
              cd packer/
              packer init .

              echo "=== Packer Validate ==="
              packer validate .
              echo "Packer validation passed!"
            displayName: 'Validate Packer Config'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - script: |
              echo "=== Ansible Version ==="
              ansible --version

              echo "=== Ansible Syntax Check ==="
              cd ansible/
              ansible-playbook playbooks/install-softwares.yml --syntax-check
              echo "Ansible syntax check passed!"
            displayName: 'Validate Ansible Playbooks'

  
  # Stage 2: Build AMI + Sign (ONLY on CI push, NOT on PR)
  - stage: BuildAndSign
    displayName: 'Stage 2 - Build AMI + Sign Artifact'
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildAMI
        displayName: 'Packer Build → Sign → Encrypt'
        timeoutInMinutes: 30
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          # ---- Build AMI with Packer ----
          - script: |
              export AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
              export AWS_DEFAULT_REGION=$(AWS_DEFAULT_REGION)

              echo "=== Packer Init ==="
              cd packer/
              packer init .

              echo "=== Packer Build ==="
              packer build -machine-readable . | tee packer-output.log

              # Extract AMI ID from manifest
              AMI_ID=$(jq -r '.builds[-1].artifact_id | split(":")[1]' packer-manifest.json)
              echo "Built AMI ID: $AMI_ID"

              if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
                echo "Failed to extract AMI ID!"
                # Fallback: try from log
                AMI_ID=$(grep 'artifact,0,id' packer-output.log | tail -1 | cut -d: -f2)
                echo "Fallback AMI ID: $AMI_ID"
              fi

              # Save AMI ID for next steps
              echo "##vso[task.setvariable variable=AMI_ID;isOutput=true]$AMI_ID"

              # Create artifact directory
              mkdir -p $(Build.ArtifactStagingDirectory)/ami-artifact

              # Create artifact files
              echo "$AMI_ID" > $(Build.ArtifactStagingDirectory)/ami-artifact/ami-id.txt
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > $(Build.ArtifactStagingDirectory)/ami-artifact/build-timestamp.txt
              echo "$(Build.BuildId)" > $(Build.ArtifactStagingDirectory)/ami-artifact/build-id.txt

              # Create metadata JSON
              cat > $(Build.ArtifactStagingDirectory)/ami-artifact/metadata.json << METAEOF
              {
                "ami_id": "$AMI_ID",
                "build_id": "$(Build.BuildId)",
                "build_number": "$(Build.BuildNumber)",
                "source_branch": "$(Build.SourceBranchName)",
                "commit_sha": "$(Build.SourceVersion)",
                "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "builder": "packer",
                "region": "$(AWS_DEFAULT_REGION)"
              }
              METAEOF

              echo "=== Artifact Contents ==="
              ls -la $(Build.ArtifactStagingDirectory)/ami-artifact/
              cat $(Build.ArtifactStagingDirectory)/ami-artifact/metadata.json
            name: packerBuild
            displayName: 'Build AMI with Packer'

          # ---- Download GPG Private Key ----
          - task: DownloadSecureFile@1
            name: gpgPrivateKey
            inputs:
              secureFile: 'gpg-private.key'
            displayName: 'Download GPG Private Key'

          # ---- Sign & Encrypt the Artifact ----
          - script: |
              echo "=== Importing GPG Private Key ==="
              gpg --batch --import $(gpgPrivateKey.secureFilePath)
              gpg --list-secret-keys

              ARTIFACT_DIR=$(Build.ArtifactStagingDirectory)/ami-artifact
              cd $ARTIFACT_DIR

              echo "=== Creating SHA256 Checksum ==="
              sha256sum ami-id.txt metadata.json build-timestamp.txt build-id.txt > checksum.sha256
              cat checksum.sha256

              echo "=== Signing Checksum with GPG ==="
              gpg --batch --yes --armor \
                --local-user "pipeline@devops.local" \
                --detach-sign checksum.sha256

              echo "=== Encrypting AMI ID ==="
              gpg --batch --yes --armor \
                --local-user "pipeline@devops.local" \
                --sign --encrypt \
                --recipient "pipeline@devops.local" \
                ami-id.txt

              # Remove unencrypted ami-id.txt (keep only encrypted version)
              rm -f ami-id.txt

              echo "=== Final Signed Artifact ==="
              ls -la $ARTIFACT_DIR
              echo ""
              echo "Files:"
              echo "  ami-id.txt.asc       → Signed + Encrypted AMI ID"
              echo "  checksum.sha256      → SHA256 checksums"
              echo "  checksum.sha256.asc  → GPG detached signature"
              echo "  metadata.json        → Build metadata"
              echo "  build-timestamp.txt  → Build timestamp"
              echo "  build-id.txt         → Pipeline build ID"
              echo ""
              echo "✅ Artifact signed and encrypted!"
            displayName: 'Sign & Encrypt Artifact'

          # ---- Publish Signed Artifact ----
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ami-artifact'
              ArtifactName: 'signed-ami-artifact'
              publishLocation: 'Container'
            displayName: 'Publish Signed Artifact'

  
  # Stage 3: Verify Artifact (proves signing works)
  - stage: VerifyArtifact
    displayName: 'Stage 3 - Verify Signed Artifact'
    dependsOn: BuildAndSign
    condition: succeeded()
    jobs:
      - job: VerifySignature
        displayName: 'Verify GPG Signature & Decrypt'
        steps:
          # ---- Download the Signed Artifact ----
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'signed-ami-artifact'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: 'Download Signed Artifact'

          # ---- Download GPG Public Key (ONLY public, not private!) ----
          - task: DownloadSecureFile@1
            name: gpgPublicKey
            inputs:
              secureFile: 'gpg-public.key'
            displayName: 'Download GPG Public Key'

          # ---- Verify & Decrypt ----
          - script: |
              echo "=== Importing GPG Public Key (ONLY public!) ==="
              gpg --batch --import $(gpgPublicKey.secureFilePath)
              gpg --list-keys

              ARTIFACT_DIR=$(System.ArtifactsDirectory)/signed-ami-artifact
              cd $ARTIFACT_DIR

              echo ""
              echo "=== Step 1: Verify Checksum Signature ==="
              gpg --batch --verify checksum.sha256.asc checksum.sha256
              if [ $? -eq 0 ]; then
                echo "Signature is VALID — artifact is authentic!"
              else
                echo "Signature is INVALID — artifact may be tampered!"
                exit 1
              fi

              echo ""
              echo "=== Step 2: Verify File Checksums ==="
              sha256sum -c checksum.sha256 --ignore-missing
              if [ $? -eq 0 ]; then
                echo "Checksums match — no tampering detected!"
              else
                echo "Checksums DON'T match — files were modified!"
                exit 1
              fi

              echo ""
              echo "=== Step 3: Decrypt AMI ID ==="
              # Need private key to decrypt (import it)
              gpg --batch --import $(gpgPrivateKey.secureFilePath) 2>/dev/null || true
              gpg --batch --yes --decrypt ami-id.txt.asc > ami-id-decrypted.txt
              AMI_ID=$(cat ami-id-decrypted.txt)
              echo "Decrypted AMI ID: $AMI_ID"

              echo ""
              echo "=== Step 4: Display Build Metadata ==="
              cat metadata.json

              echo ""
              echo "============================================"
              echo "  ALL VERIFICATION PASSED!"
              echo "============================================"
              echo "  Signature:  Valid"
              echo "  Checksums:  Match"
              echo "  AMI ID:     $AMI_ID"
              echo "  Ready for downstream Pipeline 2!"
              echo "============================================"
            displayName: 'Verify Signature & Decrypt AMI ID'

          # ---- Also download private key for decryption ----
          - task: DownloadSecureFile@1
            name: gpgPrivateKey
            inputs:
              secureFile: 'gpg-private.key'
            displayName: 'Download GPG Private Key (for decrypt)'

