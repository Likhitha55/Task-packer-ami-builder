

# Pipeline 1: Build Custom AMI + Sign Artifact with GPG

# ---- CI Trigger: Run when code is pushed to master ----
trigger:
  branches:
    include:
      - master
  paths:
    include:
      - packer/*
      - ansible/*
    exclude:
      - README.md
      - docs/*

# ---- PR Trigger: Validate on pull requests ----
pr:
  branches:
    include:
      - master
  paths:
    include:
      - packer/*
      - ansible/*

# ---- Variable Group (AWS credentials) ----
variables:
  - group: aws-devops-secrets
  - name: amiName
    value: 'devops-custom-ami'

# ---- Self-hosted agent pool ----
pool:
  name: 'aws-ec2-pool'

stages:
  
  # Stage 1: Validate (runs on BOTH CI push and PR)
  - stage: Validate
    displayName: 'Stage 1 - Validate Packer & Ansible'
    jobs:
      - job: ValidateConfig
        displayName: 'Validate Packer + Ansible Syntax'
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          - script: |
              echo "=== Packer Version ==="
              packer --version

              echo "=== Packer Init ==="
              cd packer/
              packer init .

              echo "=== Packer Validate ==="
              packer validate .
              echo "Packer validation passed!"
            displayName: 'Validate Packer Config'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - script: |
              echo "=== Ansible Version ==="
              ansible --version

              echo "=== Ansible Syntax Check ==="
              cd ansible/
              ansible-playbook playbooks/install-softwares.yml --syntax-check
              echo "Ansible syntax check passed!"
            displayName: 'Validate Ansible Playbooks'

  
  # Stage 2: Build AMI + Sign (ONLY on CI push, NOT on PR)
  - stage: BuildAndSign
    displayName: 'Stage 2 - Build AMI + Sign Artifact'
    dependsOn: Validate
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildAMI
        displayName: 'Packer Build → Sign Artifact'
        timeoutInMinutes: 30
        steps:
          - checkout: self
            displayName: 'Checkout Code'

          - script: |
              export AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
              export AWS_DEFAULT_REGION=$(AWS_DEFAULT_REGION)

              echo "=== Packer Init ==="
              cd packer/
              packer init .

              echo "=== Packer Build ==="
              packer build . 2>&1 | tee packer-output.log

              AMI_ID=$(jq -r '.builds[-1].artifact_id | split(":")' packer-manifest.json)
              echo "Built AMI ID: $AMI_ID"

              if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
                echo "Failed to extract AMI ID from manifest!"
                AMI_ID=$(grep 'artifact,0,id' packer-output.log | tail -1 | cut -d: -f2)
                echo "Fallback AMI ID: $AMI_ID"
              fi

              if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "null" ]; then
                echo "Could not extract AMI ID!"
                exit 1
              fi

              echo "##vso[task.setvariable variable=AMI_ID;isOutput=true]$AMI_ID"

              mkdir -p $(Build.ArtifactStagingDirectory)/ami-artifact
              echo "$AMI_ID" > $(Build.ArtifactStagingDirectory)/ami-artifact/ami-id.txt
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > $(Build.ArtifactStagingDirectory)/ami-artifact/build-timestamp.txt
              echo "$(Build.BuildId)" > $(Build.ArtifactStagingDirectory)/ami-artifact/build-id.txt

              cat > $(Build.ArtifactStagingDirectory)/ami-artifact/metadata.json << METAEOF
              {
                "ami_id": "$AMI_ID",
                "build_id": "$(Build.BuildId)",
                "build_number": "$(Build.BuildNumber)",
                "source_branch": "$(Build.SourceBranchName)",
                "commit_sha": "$(Build.SourceVersion)",
                "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "builder": "packer",
                "region": "$(AWS_DEFAULT_REGION)"
              }
              METAEOF

              echo "=== Artifact Contents ==="
              ls -la $(Build.ArtifactStagingDirectory)/ami-artifact/
            name: packerBuild
            displayName: 'Build AMI with Packer'

          - task: DownloadSecureFile@1
            name: gpgPrivateKey
            inputs:
              secureFile: 'gpg-private.key'
            displayName: 'Download GPG Private Key'

          - script: |
              set -e

              export GNUPGHOME=$(mktemp -d)

              echo "=== Importing GPG Private Key ==="
              gpg --batch --homedir $GNUPGHOME --import $(gpgPrivateKey.secureFilePath)
              gpg --batch --homedir $GNUPGHOME --list-secret-keys

              ARTIFACT_DIR=$(Build.ArtifactStagingDirectory)/ami-artifact
              cd $ARTIFACT_DIR

              echo "=== Creating SHA256 Checksums ==="
              sha256sum ami-id.txt metadata.json build-timestamp.txt build-id.txt > checksum.sha256
              cat checksum.sha256

              echo "=== Signing Checksum File ==="
              gpg --batch --yes --armor \
                --homedir $GNUPGHOME \
                --pinentry-mode loopback \
                --local-user "pipeline@devops.local" \
                --detach-sign checksum.sha256

              echo "=== Signing AMI ID File ==="
              gpg --batch --yes --armor \
                --homedir $GNUPGHOME \
                --pinentry-mode loopback \
                --local-user "pipeline@devops.local" \
                --detach-sign ami-id.txt

              echo "=== Verifying Signed Files Exist ==="
              test -f checksum.sha256.asc || { echo "Checksum signature missing!"; exit 1; }
              test -f ami-id.txt.asc || { echo "AMI ID signature missing!"; exit 1; }

              echo "=== Final Artifact Contents ==="
              ls -la $ARTIFACT_DIR

              rm -rf $GNUPGHOME
              echo "Artifact signed successfully!"
            displayName: 'Sign Artifact with GPG'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/ami-artifact'
              ArtifactName: 'signed-ami-artifact'
              publishLocation: 'Container'
            displayName: 'Publish Signed Artifact'

  
  # Stage 3: Verify Artifact 
  - stage: VerifyArtifact
    displayName: 'Stage 3 - Verify Signed Artifact'
    dependsOn: BuildAndSign
    condition: succeeded()
    jobs:
      - job: VerifySignature
        displayName: 'Verify GPG Signatures'
        steps:
          - task: DownloadBuildArtifacts@1
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'signed-ami-artifact'
              downloadPath: '$(System.ArtifactsDirectory)'
            displayName: 'Download Signed Artifact'

          - task: DownloadSecureFile@1
            name: gpgPublicKey
            inputs:
              secureFile: 'gpg-public.key'
            displayName: 'Download GPG Public Key'

          - script: |
              set -e

              export GNUPGHOME=$(mktemp -d)

              echo "=== Importing GPG Public Key ==="
              gpg --batch --homedir $GNUPGHOME --import $(gpgPublicKey.secureFilePath)
              gpg --batch --homedir $GNUPGHOME --list-keys

              ARTIFACT_DIR=$(System.ArtifactsDirectory)/signed-ami-artifact
              cd $ARTIFACT_DIR

              echo "=== Files in Artifact ==="
              ls -la

              echo ""
              echo "=== Step 1: Verify Checksum Signature ==="
              gpg --batch --homedir $GNUPGHOME --verify checksum.sha256.asc checksum.sha256
              echo "Checksum signature is VALID!"

              echo ""
              echo "=== Step 2: Verify AMI ID Signature ==="
              gpg --batch --homedir $GNUPGHOME --verify ami-id.txt.asc ami-id.txt
              echo "AMI ID signature is VALID!"

              echo ""
              echo "=== Step 3: Verify File Checksums ==="
              sha256sum -c checksum.sha256 --ignore-missing
              echo "All checksums match!"

              echo ""
              echo "=== Step 4: Read Verified AMI ID ==="
              AMI_ID=$(cat ami-id.txt)
              echo "Verified AMI ID: $AMI_ID"

              echo ""
              echo "=== Step 5: Build Metadata ==="
              cat metadata.json

              echo ""
              echo "============================================"
              echo "   ALL VERIFICATION PASSED!"
              echo "============================================"
              echo "  Checksum Signature:  Valid"
              echo "  AMI ID Signature:    Valid"
              echo "  File Checksums:      Match"
              echo "  AMI ID:              $AMI_ID"
              echo "  Ready for Pipeline 2 (Classic Release)!"
              echo "============================================"

              rm -rf $GNUPGHOME
            displayName: 'Verify Signatures & Read AMI ID'